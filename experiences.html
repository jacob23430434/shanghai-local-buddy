<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>所有体验项目 - Shanghai Local Buddy</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <header>
        <nav>
            <a href="/">首页</a>
            <a href="/experiences.html">体验项目</a>
            <a href="/buddies.html">我们的伙伴</a>
            <a href="/about.html">关于我们</a>
            <a href="/blog.html">博客故事</a>
            <a href="/contact.html">联系我们</a>
        </nav>
    </header>

    <main>
        <section id="experiences-list">
            <div class="container">
                <h2>探索我们的所有体验</h2>
                <p>在这里找到最适合你的上海冒险。我们按主题对体验进行了分类，以便你轻松发现。</p>
                
                <!-- Filters -->
                <div class="filters">
                    <button class="filter-btn active">全部</button>
                    <button class="filter-btn">美食</button>
                    <button class="filter-btn">艺术历史</button>
                    <button class="filter-btn">夜生活</button>
                    <button class="filter-btn">隐藏珍宝</button>
                </div>

                <!-- Experiences Grid -->
                <div class="experiences-container" style="margin-top: 3rem;">
                    <!-- Card 1 -->
                    <div class="card">
                        <img src="images/foodie-tour.jpg" alt="美食之旅">
                        <h3>弄堂美食家之旅</h3>
                        <p>跟随伙伴穿梭在上海最地道的弄堂里，品尝即将消失的街头美味。</p>
                    </div>
                    <!-- Card 2 -->
                    <div class="card">
                        <img src="images/art-gallery.jpg" alt="艺术之旅">
                        <h3>M50艺术区漫步</h3>
                        <p>探索上海的“SOHO”，与画廊主理人交流，发现中国当代艺术的魅力。</p>
                    </div>
                    <!-- Card 3 -->
                    <div class="card">
                        <img src="images/nightlife.jpg" alt="夜生活">
                        <h3>法租界微醺之夜</h3>
                        <p>从安静的爵士酒吧到热闹的精酿酒馆，体验上海优雅又先锋的夜生活。</p>
                    </div>
                    <!-- Card 4 (New) -->
                    <div class="card">
                        <img src="images/hidden-gem.jpg" alt="隐藏珍宝">
                        <h3>苏州河畔的秘密</h3>
                        <p>骑行探索苏州河沿岸的历史仓库和创意空间，发现城市的另一面。</p>
                    </div>
                    <!-- More cards can be added here -->
                </div>
            </div>
        </section>
    </main>

    <footer>
        <p>&copy; 2026 Shanghai Local Buddy. All Rights Reserved.</p>
    </footer>

    <script src="js/main.js"></script>
</body>
</html>
